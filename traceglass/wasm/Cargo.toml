[package]
name = "traceglass-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "WebAssembly bindings for TraceGlass in-browser log scanning"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[features]
default = ["console_error_panic_hook"]

[dependencies]
traceglass = { path = "..", default-features = false, features = ["wasm-scan"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
serde-wasm-bindgen = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"

[profile.release]
opt-level = "s"
lto = true
