[package]
name = "traceglass"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "traceglass"
description = "Grammarly for logs — interactive TUI to highlight, scan, and triage diagnostic logs"
license = "MIT"
repository = "https://github.com/dorman/traceglass"
homepage = "https://github.com/dorman/traceglass"
documentation = "https://github.com/dorman/traceglass/blob/main/traceglass/docs/USER_GUIDE.md"
readme = "README.md"
keywords = ["logs", "tui", "diagnostics", "cli", "triage"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["samples/big.log", "target/", ".github/"]

[[bin]]
name = "traceglass"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
csv = "1.4.0"
crossterm = "0.29.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
portable-pty = "0.9.0"
