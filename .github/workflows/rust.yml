# @polsia:user-owned — Rust validation and installer build matrix.
name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# No job gets any token scope by default; each opts into exactly what it needs
# below. A job added later without a `permissions:` block therefore fails
# closed rather than silently inheriting access. Matches release.yml.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # Checkout only; nothing in this workflow writes back to the repository.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    # persist-credentials: false keeps the job token out of .git/config. This
    # workflow only reads the repository.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026
      with:
        toolchain: stable
        components: clippy, rustfmt

    - name: Cache cargo
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: traceglass

    - name: Format
      working-directory: traceglass
      run: cargo fmt --all -- --check

    - name: Clippy
      working-directory: traceglass
      run: cargo clippy --all-targets --locked -- -D warnings

    - name: Test
      working-directory: traceglass
      run: cargo test --locked --verbose

    - name: Release build
      working-directory: traceglass
      run: cargo build --release --locked --verbose

    - name: Installer build
      working-directory: traceglass
      run: cargo build --manifest-path installer/Cargo.toml --release

    - name: Validate package contract
      if: runner.os == 'Linux'
      working-directory: traceglass
      run: |
        cargo package --locked

    - name: Install smoke (Unix)
      if: runner.os != 'Windows'
      working-directory: traceglass
      run: |
        cargo install --path . --force --locked
        traceglass --version
        traceglass --help | head -n 5

  # Advisories are platform-independent, so this runs once rather than across
  # the build matrix. It only reads Cargo.lock; it does not build the crate.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026
      with:
        toolchain: stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        shared-key: audit
        workspaces: traceglass

    # Built from source rather than via an installer action to avoid adding
    # another third-party action to the supply chain. rust-cache restores the
    # resulting binary, so this compiles only when the cache misses.
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    # Fails on RustSec vulnerability advisories. Informational warnings
    # (unmaintained, yanked) are reported but do not block: they are not
    # vulnerabilities, and one appearing upstream should not fail unrelated PRs.
    - name: Audit dependencies
      working-directory: traceglass
      run: cargo audit

  # Static analysis of the workflows themselves: token scope, action pinning,
  # credential persistence, template injection. This turns the hardening in
  # a434eb2 and a789276 into an enforced rule rather than a one-off cleanup.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch @ 2026
      with:
        toolchain: stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        shared-key: zizmor

    - name: Install zizmor
      run: cargo install zizmor --locked

    # --offline skips the audits that query the GitHub API, so the job needs no
    # token. Informational findings are reported but do not fail the build.
    - name: Audit workflows
      run: zizmor --offline --min-severity medium .github/workflows/
